stages:
  preprocess:
    cmd: python src/data/preprocess.py
    deps:
      - src/data/preprocess.py
      - data/dataset.csv
    params:
      - preprocess.missing_strategy
    outs:
      - data/processed/train_dataset.csv
  split:
    cmd: python src/data/split.py
    deps:
      - src/data/split.py
      - data/processed/train_dataset.csv
    params:
      - split.test_size
      - split.random_state
      - split.stratify
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
